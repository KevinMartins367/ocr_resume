[project]
name = "uocr"
version = "0.1.0"
description = "Wrapper local (WSL2, pouca VRAM) para o baidu/Unlimited-OCR-2: PDF/imagem -> Markdown, com resumo por pasta (Qwen2.5-7B)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Versões testadas pelo projeto oficial (README do baidu/Unlimited-OCR)
    "torch==2.13.0",
    "torchvision==0.28.0",
    "pillow>=12.3.0",
    "transformers==4.52.1",
    "huggingface-hub==0.36.0",
    "tokenizers==0.21.4",
    "addict==2.4.0",
    "einops==0.8.2",
    "easydict==1.13",
    # Extras deste wrapper
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "gradio>=6.17.3",
    "pymupdf==1.27.2.2",
]

# Comandos instalados no ambiente: `uv run uocr ...`, `uv run uocr-resumo ...`, `uv run uocr-web ...`
[project.scripts]
uocr = "uocr.ocr.cli:main"
uocr-resumo = "uocr.resumo.cli:main"
uocr-web = "uocr.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uocr"]

[tool.uv]
# Só roda no WSL2 (Linux): o lock não precisa resolver Windows/macOS.
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"   # tests/ocr e tests/resumo têm arquivos com o mesmo nome
pythonpath = [".", "tests"]   # uocr/ da pasta (não a cópia instalada) e os helpers de tests/conftest.py

[tool.coverage.run]
source = ["uocr"]
# Cópia literal do repositório oficial (não editamos): fica fora da medição.
omit = ["uocr/ocr/_postprocess.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if __name__ == .__main__.:"]
